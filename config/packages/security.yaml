security:
  password_hashers:
    App\Entity\User: 'auto'

  role_hierarchy:
    ROLE_PARTNER: ROLE_COLLABORATOR

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: username

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js|assets|vendor)/
      security: false
    main:
      lazy: true
      provider: app_user_provider
      user_checker: App\Security\ActiveUserChecker
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        csrf_parameter: _csrf_token
        csrf_token_id: authenticate
        default_target_path: app_dashboard
      login_throttling:
        max_attempts: 5
        interval: '15 minutes'
      logout:
        path: app_logout
        target: app_login
        enable_csrf: true

  access_control:
    - { path: ^/login$, roles: PUBLIC_ACCESS }
    - { path: ^/admin, roles: ROLE_PARTNER }
    - { path: ^/, roles: ROLE_COLLABORATOR }

when@test:
  security:
    password_hashers:
      App\Entity\User:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
