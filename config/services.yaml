parameters:
  app.name: 'Studio Commesse'
  app.version: '0.9.2-M9.2-H'
  app.default_hourly_rate_cents: 0
  app.attachment_storage_dir: '%kernel.project_dir%/var/storage/attachments'
  app.attachment_mutation_lock_file: '%kernel.project_dir%/var/locks/attachments.lock'
  app.request_runtime_lock_file: '%kernel.project_dir%/var/locks/requests.lock'
  app.timer_mutation_lock_file: '%kernel.project_dir%/var/locks/timers.lock'
  app.maintenance_marker_file: '%kernel.project_dir%/var/maintenance.lock'
  app.login_max_attempts: 5
  app.login_lockout_interval: '1 hour'
  app.login_lockout_minutes: 60

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Service/FileLock.php'
      - '../src/Service/AuditRecord.php'
      - '../src/Service/QuarantinedAttachment.php'
      - '../src/Service/FileLockManager.php'
      - '../src/Service/BackupSummary.php'
      - '../src/Service/RestoreResult.php'
      - '../src/Kernel.php'

  App\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']

  App\Command\LoadDemoFixturesCommand:
    arguments:
      $kernelEnvironment: '%kernel.environment%'

  App\Command\SeedPerformanceDatasetCommand:
    arguments:
      $kernelEnvironment: '%kernel.environment%'

  App\Command\BenchmarkCapacityCommand:
    arguments:
      $kernelEnvironment: '%kernel.environment%'

  App\Service\HourlyRateResolver:
    arguments:
      $defaultHourlyRateCents: '%app.default_hourly_rate_cents%'

  App\Service\AttachmentMutationLock:
    arguments:
      $lockFile: '%app.attachment_mutation_lock_file%'

  App\Service\RequestRuntimeLock:
    arguments:
      $lockFile: '%app.request_runtime_lock_file%'

  App\Service\TimerMutationLock:
    arguments:
      $lockFile: '%app.timer_mutation_lock_file%'

  App\Service\MaintenanceMode:
    arguments:
      $markerFile: '%app.maintenance_marker_file%'

  App\Service\BackupManager:
    arguments:
      $attachmentStorageDirectory: '%app.attachment_storage_dir%'
      $appVersion: '%app.version%'

  App\Service\AuditPrivacyGuard:
    arguments:
      $secret: '%kernel.secret%'

  App\EventSubscriber\SecurityAuditSubscriber:
    arguments:
      $loginLockoutMinutes: '%app.login_lockout_minutes%'
